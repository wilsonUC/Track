    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Inicialización inmediata de tema antes de renderizar (evita parpadeo de modo claro) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('track_theme');
          var isDark = false;
          if (saved === 'oscuro') {
            isDark = true;
          } else if (saved === 'claro') {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <title>FinanzasTrack</title>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950">
